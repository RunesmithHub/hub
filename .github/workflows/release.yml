# When a version tag such as v0.1.0 is pushed: packs RunesmithHub.Protocol and RunesmithHub.Tool with the tag's version and pushes them to
# the hub feed.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  packages:
    name: Pack the protocol library and the tool
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Pack
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet pack src/RunesmithHub.Protocol --configuration Release --output artifacts/packages -warnaserror -p:Version="$version"
          dotnet pack src/RunesmithHub.Tool --configuration Release --output artifacts/packages -warnaserror -p:Version="$version"

      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hub-packages
          path: artifacts/packages/*.nupkg
          retention-days: 7
          if-no-files-found: error

  hub-feed:
    name: Push the packages to the hub feed
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: hub-feed
    permissions:
      contents: read
    steps:
      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hub-packages
          path: packages

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # The package is checked against the SHA-512 nuget.org lists for it and installed from a folder that is the only package source.
      - name: Install Sleet
        env:
          SLEET_VERSION: 7.2.0
          SLEET_SHA512: 7f0ead4b6eef92d3d84b2ad30d54815688f2c5402d4acd58023e8eb4c312f69ffd10eecf8f54e21262643da29b41fb550f2d9168589d9695a970636783a9f67a
        run: |
          source="$RUNNER_TEMP/sleet-source"
          mkdir -p "$source"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --output "$source/sleet.$SLEET_VERSION.nupkg" \
            "https://api.nuget.org/v3-flatcontainer/sleet/$SLEET_VERSION/sleet.$SLEET_VERSION.nupkg"
          echo "$SLEET_SHA512  $source/sleet.$SLEET_VERSION.nupkg" | sha512sum --check --strict --quiet
          printf '<?xml version="1.0" encoding="utf-8"?>\n<configuration>\n  <packageSources>\n    <clear />\n    <add key="sleet" value="%s" />\n  </packageSources>\n</configuration>\n' "$source" > "$source/nuget.config"
          NUGET_PACKAGES="$RUNNER_TEMP/sleet-packages" dotnet tool install sleet --version "$SLEET_VERSION" --tool-path "$RUNNER_TEMP/tools" --configfile "$source/nuget.config"

      # Holds the bucket keys, so it lives outside the workspace and is removed after the push.
      - name: Write the Sleet configuration
        env:
          HUB_FEED_ACCOUNT_ID: ${{ vars.HUB_FEED_ACCOUNT_ID }}
          HUB_FEED_BUCKET: ${{ vars.HUB_FEED_BUCKET }}
          HUB_FEED_ACCESS_KEY_ID: ${{ secrets.HUB_FEED_ACCESS_KEY_ID }}
          HUB_FEED_SECRET_ACCESS_KEY: ${{ secrets.HUB_FEED_SECRET_ACCESS_KEY }}
        run: |
          umask 077
          jq -n \
            --arg serviceURL "https://$HUB_FEED_ACCOUNT_ID.r2.cloudflarestorage.com" \
            --arg bucketName "$HUB_FEED_BUCKET" \
            --arg accessKeyId "$HUB_FEED_ACCESS_KEY_ID" \
            --arg secretAccessKey "$HUB_FEED_SECRET_ACCESS_KEY" \
            '{sources: [{name: "hub-feed", type: "s3", serviceURL: $serviceURL, bucketName: $bucketName, disablePayloadSigning: true,
              path: "https://nuget.runesmith.dev/", baseURI: "https://nuget.runesmith.dev/", accessKeyId: $accessKeyId, secretAccessKey: $secretAccessKey}]}' \
            > "$RUNNER_TEMP/sleet.json"

      # Versions already on the feed are skipped, never overwritten, so a re-run finishes what a failed run started.
      - name: Push to the hub feed
        # R2 rejects the whole-object checksums the AWS SDK adds to multipart uploads.
        env:
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
        run: '"$RUNNER_TEMP/tools/sleet" push packages --config "$RUNNER_TEMP/sleet.json" --source hub-feed --skip-existing'

      - name: Remove the Sleet configuration
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/sleet.json"
